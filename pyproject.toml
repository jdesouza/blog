[project]
name = "blog"
version = "0.1.0"
description = "Fairwinds blog — CrewAI automation"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.86.0",
]

[project.scripts]
run_crew = "blog.main:run"
train_crew = "blog.main:train"
replay_crew = "blog.main:replay"
test_crew = "blog.main:test"

[tool.crewai]
type = "crew"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blog"]
