# Misconfig: Pod uses default ServiceAccount with automountServiceAccountToken true
# and no explicit SA hardening (common baseline failure for policies).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-default-sa-token
  namespace: security-test-bench
  labels:
    security-scanning/fixture: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bench-default-sa-token
  template:
    metadata:
      labels:
        app: bench-default-sa-token
    spec:
      automountServiceAccountToken: true
      containers:
        - name: main
          image: curlimages/curl:7.73.0
          imagePullPolicy: IfNotPresent
          command: ["sleep", "3600"]
